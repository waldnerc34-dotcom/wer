<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0c0f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="APEX" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <style>
      /* Self-hosted typefaces (SIL Open Font License; see public/assets/CREDITS.md). */
      @font-face {
        font-family: "Bebas Neue";
        src: url("./assets/fonts/BebasNeue-Regular.ttf") format("truetype");
        font-weight: 400;
        font-display: swap;
      }
      @font-face {
        font-family: "Barlow Condensed";
        src: url("./assets/fonts/BarlowCondensed-Regular.ttf") format("truetype");
        font-weight: 400;
        font-display: swap;
      }
      @font-face {
        font-family: "Barlow Condensed";
        src: url("./assets/fonts/BarlowCondensed-SemiBold.ttf") format("truetype");
        font-weight: 600;
        font-display: swap;
      }
    </style>
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="./icons/favicon-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
    <title>APEX — Racing Simulator</title>
    <meta
      name="description"
      content="A physically-based 3D racing simulator: Pacejka tyre model, raycast suspension, real glTF supercars and HDRI lighting, running in the browser."
    />
  </head>
  <body>
    <canvas id="viewport"></canvas>

    <div id="hud" class="hud hidden"></div>
    <div id="touch" class="hidden"></div>
    <div id="rotate" class="rotate" aria-hidden="true">
      <div class="rotate-phone"></div>
      <p>Turn your phone sideways</p>
    </div>

    <div id="overlay"></div>

    <noscript>
      <p style="color: #fff; font: 16px system-ui; padding: 2rem">
        APEX needs JavaScript and a WebGL2-capable browser.
      </p>
    </noscript>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
