# Builds the game and publishes it to GitHub Pages on every push.
#
# The site is served from the gh-pages branch (Settings → Pages → Source:
# Deploy from a branch), so this workflow's job is to keep that branch equal
# to a fresh, tested build. Deploying through the newer Actions route instead
# is not an option here: with the branch source selected, GitHub rejects an
# actions/deploy-pages job outright, and the workflow token is not allowed to
# create or reconfigure the Pages site either.
#
# The site lands at https://<owner>.github.io/<repo>/ — the build uses
# relative asset paths, so the sub-path is fine.

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/hyper-realistic-racing-game-46i754
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - run: npm test

      - run: npm run build

      # Each deploy replaces the branch outright (force_orphan) — the built
      # site is ~17 MB, and there is no reason to keep every build in history.
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'Deploy ${{ github.sha }}'
