# Builds the game and publishes dist/ to the gh-pages branch on every push.
#
# GitHub enables Pages automatically for a repository the first time a
# gh-pages branch appears, which is why this deploys through a branch rather
# than the newer Actions artifact route: that route needs the Pages site to
# be created through the API first, and the workflow's own token is not
# allowed to do that. If the site does not come up on its own, the one
# manual step is Settings → Pages → Source: "Deploy from a branch" →
# gh-pages / (root).
#
# The site lands at https://<owner>.github.io/<repo>/ — the build uses
# relative asset paths, so the sub-path is fine.

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/hyper-realistic-racing-game-46i754
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - run: npm test

      - run: npm run build

      # Each deploy replaces the branch outright (force_orphan) — the built
      # site is ~17 MB, and there is no reason to keep every build in history.
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'Deploy ${{ github.sha }}'
