# Builds the game and publishes dist/ to GitHub Pages on every push.
#
# Pages is enabled by the workflow itself (configure-pages `enablement`), so
# nothing needs switching on in the repository settings first. The site lands
# at https://<owner>.github.io/<repo>/ — the build uses relative asset paths,
# so the sub-path is fine.

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/hyper-realistic-racing-game-46i754
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - run: npm test

      - run: npm run build

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
