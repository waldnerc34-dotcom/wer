# Builds the game and publishes it to GitHub Pages on every push.
#
# Two routes, so that whichever the repository can use works without anyone
# touching the settings page:
#
#  - `pages` publishes dist/ straight to the Pages site through the Actions
#    route, and switches Pages on for the repository the first time it runs
#    (configure-pages with `enablement`). GitHub only offers Pages on a
#    public repository under the free plan, so on a private one this job
#    fails until the repository is made public — after which the next push,
#    or a manual run of this workflow, brings the site up on its own.
#  - `branch` keeps a built copy on the gh-pages branch, for the older
#    "Deploy from a branch" source.
#
# The site lands at https://<owner>.github.io/<repo>/ — the build uses
# relative asset paths, so the sub-path is fine.

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/hyper-realistic-racing-game-46i754
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - run: npm test

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      # Each deploy replaces the branch outright (force_orphan) — the built
      # site is ~17 MB, and there is no reason to keep every build in history.
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'Deploy ${{ github.sha }}'

  pages:
    needs: build
    runs-on: ubuntu-latest
    # A private repository on the free plan cannot have a Pages site; the
    # failure is expected there and must not make the build look broken.
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - id: deployment
        uses: actions/deploy-pages@v4
